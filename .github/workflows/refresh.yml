name: refresh

# Weekly cron: fetch, process, validate. On success, commit the new processed
# files plus a dated snapshot, then trigger the deploy. On failure, open an
# issue with the validation output and don't commit (so existing data is
# preserved).
#
# All three steps run even if a previous one failed, so we get the most
# diagnostic information possible. The commit step only fires when the whole
# pipeline was green.

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      update_snapshot:
        description: "Accept any ranking change (update the fixture snapshot)"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Fetch
        id: fetch
        run: |
          set -o pipefail
          uv run civis fetch 2>&1 | tee fetch.log

      - name: Process
        id: process
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          uv run civis process --snapshot 2>&1 | tee process.log

      - name: Validate
        id: validate
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.update_snapshot }}" = "true" ]; then
            uv run civis validate --update-snapshot 2>&1 | tee validate.log
          else
            uv run civis validate 2>&1 | tee validate.log
          fi

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnostics
          path: |
            data/raw/manifest.json
            fetch.log
            process.log
            validate.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tail = (path) =>
              fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-2500) : '(no log)';
            const fetchLog    = tail('fetch.log');
            const processLog  = tail('process.log');
            const validateLog = tail('validate.log');
            let manifestSummary = '(no manifest)';
            if (fs.existsSync('data/raw/manifest.json')) {
              try {
                const m = JSON.parse(fs.readFileSync('data/raw/manifest.json', 'utf8'));
                const lines = [
                  `indicators ok: ${m.n_indicators_ok}/${m.n_indicators_total}`,
                  `sources ok: ${m.n_sources_ok}, hard-failed: ${m.n_sources_failed}, soft-failed: ${m.n_sources_soft_failed}`,
                  ``,
                  `failures:`,
                  ...(m.failures || []).map(f => `  - ${f.indicator} [${f.kind}:${f.ref}] ${f.error}`),
                ];
                if (m.soft_failures && m.soft_failures.length) {
                  lines.push('', 'soft failures (sibling source recovered):');
                  m.soft_failures.forEach(f => lines.push(`  - ${f.indicator} [${f.kind}:${f.ref}] ${f.error}`));
                }
                manifestSummary = lines.join('\n');
              } catch (e) { manifestSummary = `(manifest parse error: ${e.message})`; }
            }
            const fetchOK    = "${{ steps.fetch.outcome    }}" === 'success';
            const processOK  = "${{ steps.process.outcome  }}" === 'success';
            const validateOK = "${{ steps.validate.outcome }}" === 'success';
            const status = (s) => s ? 'ok' : 'FAILED';
            const today = new Date().toISOString().slice(0,10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Refresh failed (${today})`,
              labels: ['data-refresh', 'needs-triage'],
              body: [
                `Weekly refresh failed. No new data has been committed; the existing data file (if any) is unchanged.`,
                `Diagnostics artifact: \`refresh-diagnostics\` on this run.`,
                ``,
                `**Step status**`,
                `- fetch: ${status(fetchOK)}`,
                `- process: ${status(processOK)}`,
                `- validate: ${status(validateOK)}`,
                ``,
                `**fetch manifest summary**`,
                '```',
                manifestSummary,
                '```',
                ``,
                `**fetch.log (tail)**`,
                '```',
                fetchLog,
                '```',
                ``,
                `**process.log (tail)**`,
                '```',
                processLog,
                '```',
                ``,
                `**validate.log (tail)**`,
                '```',
                validateLog,
                '```',
              ].join('\n'),
            });

      - name: Commit refreshed data
        if: success()
        run: |
          git config user.name "civis-bot"
          git config user.email "civis-bot@users.noreply.github.com"
          git add data/processed data/snapshots tests/fixtures/ranking_snapshot.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
