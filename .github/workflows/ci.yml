name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check pipeline tests
      - name: Test
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build
      - name: Bundle size guard
        working-directory: web
        run: |
          MAX_KB=200
          actual_kb=$(du -sk dist/assets/index-*.js | cut -f1)
          echo "JS bundle: ${actual_kb}KB (limit ${MAX_KB}KB)"
          if [ "$actual_kb" -gt "$MAX_KB" ]; then
            echo "::error::JS bundle exceeds ${MAX_KB}KB budget"
            exit 1
          fi
