<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Civis Index — Where do people actually live the best lives?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Hierarchical wellbeing index across 29 advanced economies. 33 indicators, 9 equally-weighted domains. Adjust the weights to disagree."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <div class="row title-row">
          <h1>Civis<span class="version">·v1</span></h1>
          <p class="tagline">Where do people <em>actually</em> live the best lives?</p>
          <span class="stamp" id="data-stamp"></span>
        </div>
        <div class="row controls-row">
          <div class="pickers">
            <span class="dot dot-a"></span>
            <select id="sel-a" aria-label="Highlight A"></select>
            <span class="dot dot-b"></span>
            <select id="sel-b" aria-label="Highlight B"></select>
            <button class="link-btn" id="swap" title="Swap A and B" aria-label="Swap">⇄</button>
          </div>
          <div class="actions">
            <button class="link-btn" id="weights-toggle">weights</button>
            <button class="link-btn" id="about-toggle">about</button>
          </div>
        </div>
      </header>

      <div class="weights-panel" id="weights-panel" hidden>
        <div class="weights-grid" id="weights-grid"></div>
        <div class="weights-actions">
          <button class="link-btn" id="weights-reset">reset to equal</button>
          <span class="fine">sliders normalize to sum to 1</span>
        </div>
      </div>

      <div class="about-panel" id="about-panel" hidden></div>

      <nav class="tabs" id="tabs" aria-label="Sections"></nav>

      <div id="empty-state" class="empty-state" hidden>
        <p>
          No <code>civis.json</code> yet. Run <code>civis fetch &amp;&amp; civis process</code> or wait for
          the weekly refresh.
        </p>
      </div>

      <main id="content" hidden></main>

      <footer class="footer">
        <span>Sources: WB · OWID · V-Dem · RSF · TI · UNDP · OECD · Gallup</span>
        <span class="dot-sep">·</span>
        <span>CC-BY 4.0</span>
        <span class="dot-sep">·</span>
        <a href="https://github.com/chraltro/civis" rel="noopener">github</a>
      </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
